<!DOCTYPE html>
<!-- 声明这是一个HTML5文档 -->

<html lang="zh-CN">
<!-- HTML文档的根元素，lang属性指定语言为中文简体 -->

<head>
    <!-- 头部区域，包含页面的元信息 -->
    <meta charset="UTF-8">
    <!-- 设置文档的字符编码为UTF-8，支持中文等多种语言 -->
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 视口设置，使页面在不同设备上都能正常显示 -->
    
    <title>我的第一个HTML页面</title>
    <!-- 页面标题，显示在浏览器标签栏上 -->
    
    <!-- 简单的内部CSS样式 -->
    <style>
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            /* 设置字体，优先使用Arial，其次是微软雅黑 */
            background-color: #f0f0f0;
            /* 页面背景颜色 */
            margin: 20px;
            /* 页面边距 */
        }
        
        h1 {
            color: #333;
            /* 标题文字颜色 */
            text-align: center;
            /* 标题居中对齐 */
        }
        
        p {
            line-height: 1.6;
            /* 设置段落行高 */
        }
        
        .container {
            max-width: 800px;
            /* 容器最大宽度 */
            margin: 0 auto;
            /* 容器居中 */
            background-color: white;
            /* 容器背景颜色 */
            padding: 20px;
            /* 容器内边距 */
            border-radius: 8px;
            /* 容器圆角 */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            /* 容器阴影效果 */
        }
    </style>
</head>

<body>
    <!-- 页面主体内容区域 -->
    
    <div class="container">
        <!-- 容器div，用于组织内容 -->
        
        <!-- 一级标题 -->
        <h1>欢迎来到HTML世界！</h1>
        
        <!-- 二级标题 -->
        <h2>什么是HTML？</h2>
        
        <!-- 段落文本 -->
        <p>HTML（超文本标记语言）是用于创建网页的标准标记语言。它使用标记标签来描述网页内容。</p>
        
        <!-- 列表示例 -->
        <h2>HTML的基本组成部分</h2>
        <ul>
            <!-- 无序列表 -->
            <li>文本内容（文字、标题等）</li>
            <li>图片</li>
            <li>链接</li>
            <li>表格</li>
            <li>表单</li>
        </ul>
        
        <!-- 图片示例 -->
        <h2>这是一个图片示例</h2>
        <p>图片会显示在这里，如果图片无法加载则显示alt属性中的文本：</p>
        <img src="https://via.placeholder.com/400x200" alt="示例图片" style="max-width: 100%;">
        <!-- img标签用于显示图片，src属性指定图片路径，alt属性提供替代文本 -->
        
        <!-- 链接示例 -->
        <h2>这是一个链接示例</h2>
        <p>点击下方链接可以跳转到百度首页：</p>
        <a href="https://www.baidu.com" target="_blank">访问百度</a>
        <!-- a标签用于创建链接，href属性指定目标URL，target="_blank"表示在新标签页中打开 -->
        
        <!-- 简单表格示例 -->
        <h2>这是一个简单的表格</h2>
        <table border="1" cellspacing="0" cellpadding="5" style="width: 100%; border-collapse: collapse;">
            <!-- table标签用于创建表格 -->
            <tr>
                <!-- tr标签表示表格的一行 -->
                <th>姓名</th>
                <!-- th标签表示表头单元格 -->
                <th>年龄</th>
                <th>城市</th>
            </tr>
            <tr>
                <td>张三</td>
                <!-- td标签表示普通单元格 -->
                <td>25</td>
                <td>北京</td>
            </tr>
            <tr>
                <td>李四</td>
                <td>30</td>
                <td>上海</td>
            </tr>
        </table>
        
        <!-- 简单表单示例 -->
        <h2>这是一个简单的表单</h2>
        <form action="#" method="get">
            <!-- form标签用于创建表单，action指定提交地址，method指定提交方式 -->
            <p>
                <label for="name">姓名：</label>
                <!-- label标签用于为表单元素添加标签，for属性与input的id对应 -->
                <input type="text" id="name" name="name" placeholder="请输入姓名">
                <!-- input标签创建输入框，type指定类型，id唯一标识，name用于表单提交 -->
            </p>
            <p>
                <label for="email">邮箱：</label>
                <input type="email" id="email" name="email" placeholder="请输入邮箱">
            </p>
            <p>
                <input type="submit" value="提交">
                <!-- 提交按钮 -->
            </p>
        </form>
    </div>
    
    <!-- 页面底部 -->
    <footer style="text-align: center; margin-top: 20px; color: #666;">
        <p>&copy; 2023 我的HTML学习之旅</p>
    </footer>
</body>

</html>
